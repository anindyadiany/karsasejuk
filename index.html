<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Tiers</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700">
    <link rel="stylesheet" href="styles.css">
    <style>
        .panel {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pricing-container {
            display: flex;
        }

        .btn-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .btn-green {
            background-color: #386641;
            color: white;
            font-size: 1.5em;
            padding: 15px 35px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-green:hover {
            background-color: darkgreen;
        }
    </style>
</head>

<body>
    <div class="panel">
        <div class="pricing-container">
            <div class="pricing-plan">
                <img src="o2.png" alt="" class="pricing-img">
                <h2 class="pricing-header">O2</h2>
                <ul class="pricing-features">
                    <!-- <li class="pricing-features-item">Custom domains</li> -->
                    <li class="pricing-features-item">Deskripsi singkat tentang.....</li>
                </ul>
                <span class="pricing-price oxygen">18%</span>
                <!-- <a href="#/" class="pricing-button">Sign up</a> -->
            </div>

            <div class="pricing-plan">
                <img src="pm.png" alt="" class="pricing-img">
                <h2 class="pricing-header">PM 2.5</h2>
                <ul class="pricing-features">
                    <!-- <li class="pricing-features-item">Dedicated</li> -->
                    <li class="pricing-features-item">Deskripsi singkat tentang.....</li>
                </ul>
                <span class="pricing-price pm">XX</span>
                <!-- <a href="#/" class="pricing-button">Free trial</a> -->
            </div>

            <div class="pricing-plan">
                <img src="temp.png" alt="" class="pricing-img">
                <h2 class="pricing-header">Temperature</h2>
                <ul class="pricing-features">
                    <!-- <li class="pricing-features-item">Dedicated</li> -->
                    <li class="pricing-features-item">Deskripsi singkat tentang.....</li>
                </ul>
                <span class="pricing-price temperature">31 C</span>
                <!-- <a href="#/" class="pricing-button">Free trial</a> -->
            </div>

            <div class="pricing-plan">
                <img src="humid.png" alt="" class="pricing-img">
                <h2 class="pricing-header">Humidity</h2>
                <ul class="pricing-features">
                    <!-- <li class="pricing-features-item">Custom domains</li> -->
                    <li class="pricing-features-item">Deskripsi singkat tentang.....</li>
                </ul>
                <span class="pricing-price humidity">XX</span>
                <!-- <a href="#/" class="pricing-button">Sign up</a> -->
            </div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn btn-green btn-lg">Power</button>
        </div>
    </div>
</body>

</html>
